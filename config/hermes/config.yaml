model:
  provider: deepseek
  default: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1

agent:
  max_turns: 12
  api_max_retries: 1
  reasoning_effort: none
  disabled_toolsets:
    - terminal
    - file
    - web
    - search
    - browser
    - vision
    - image_gen
    - skills_hub
    - memory
    - session_search
    - tts
    - cronjob
    - messaging

# The pilot is planning-only. Northstar remains the authority and capability
# boundary, so Hermes receives no terminal, file, browser, or connector tools.
platform_toolsets:
  api_server: [todo]

terminal:
  backend: local
  cwd: .
  home_mode: profile
  timeout: 60

skills:
  creation_nudge_interval: 0
